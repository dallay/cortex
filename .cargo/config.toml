[registry]
# Dependency cooldown: Cargo skips crate versions published more recently than
# this window, so a compromised release has time to be detected and yanked
# before it enters the lockfile. Requires Cargo 1.100 or newer.
#
# Override for a single urgent update:
#   CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update <crate> --precise <version>
global-min-publish-age = "3 days"
