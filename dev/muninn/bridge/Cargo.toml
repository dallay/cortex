[package]
name = "muninn-bridge-spike"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[workspace]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints]
workspace = true

[patch.crates-io]
candle-core = { path = "../../../third_party/candle-core" }

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
neo4rs = "=0.8.0"
subtle = "2"
sha2 = "0.10"
url = "=2.5.8"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.7.3"
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
safetensors = "=0.8.0"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
calcifer-macos-acl = "=0.1.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "=3.27.0"
rcgen = "=0.14.10"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
