name: muninn-mcp-discovery

services:
  discovery:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    user: "${MUNINN_ORACLE_UID:-7474}:${MUNINN_ORACLE_GID:-7474}"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 768m
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    tmpfs:
      - /tmp:mode=1777,size=128m
    volumes:
      - "${MUNINN_REFERENCE_ROOT:?Define el directorio de referencias verificadas}:/references:ro"
      - ./artifacts:/artifacts
    command: [--sources, /references, --output, /artifacts/mcp-discovery]
