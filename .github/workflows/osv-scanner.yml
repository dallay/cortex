# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up periodic OSV-Scanner scanning for vulnerabilities,
# in addition to a PR check which fails if new vulnerabilities are introduced.
#
# For more examples and options, including how to ignore specific vulnerabilities,
# see https://google.github.io/osv-scanner/github-action/

name: OSV-Scanner

on:
  pull_request:
    branches: ["main", "develop"]
  merge_group:
    branches: ["main", "develop"]
  schedule:
    # Weekly: Tuesday 3:17 AM — aligns with security-deep.yml schedule
    - cron: "17 3 * * 2"
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Read commit contents
  contents: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6bc832ee85d316ab9aeccf71929026841bd0e1ee" # v2.7.1
    with:
      # Scan the entire repository, skipping git history for faster execution.
      # OSV-Scanner natively detects Cargo.lock, pnpm-lock.yaml, and other
      # lockfiles in a Rust/Node.js monorepo.
      scan-args: |-
        -r
        --skip-git
        ./
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6bc832ee85d316ab9aeccf71929026841bd0e1ee" # v2.7.1
    with:
      # Scan the entire repository, skipping git history for faster execution.
      # OSV-Scanner natively detects Cargo.lock, pnpm-lock.yaml, and other
      # lockfiles in a Rust/Node.js monorepo.
      scan-args: |-
        -r
        --skip-git
        ./
