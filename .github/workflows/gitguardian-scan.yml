name: GitGuardian scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  gitguardian-scan:
    name: GitGuardian scan
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')
    uses: dallay/common-actions/.github/workflows/gitguardian-scan.yml@fd7e882c6c0830f25691684a2978074f9e5b6b6a # main
    secrets:
      gitguardian-api-key: ${{ secrets.GITGUARDIAN_API_KEY }}
