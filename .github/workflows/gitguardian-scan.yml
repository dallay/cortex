name: GitGuardian scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitguardian-scan:
    name: GitGuardian scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    uses: dallay/common-actions/.github/workflows/gitguardian-scan.yml@8dd14d86a6bf1a4673aba902e3c3e27993b0e583 # main
    secrets:
      gitguardian-api-key: ${{ secrets.GITGUARDIAN_API_KEY }}
