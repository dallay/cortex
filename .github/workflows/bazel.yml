name: Bazel (non-blocking)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: bazel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bazel-test-linux:
    name: Bazel test (Linux, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Classify changed paths
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-affected-crates.cjs

      # Rook embeds the existing pnpm-built dashboard assets in its Rust binary.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        if: steps.affected.outputs.mode != 'docs-only'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.affected.outputs.mode != 'docs-only'
        with:
          node-version: 26
          cache: pnpm
      - name: Build dashboard assets
        if: steps.affected.outputs.mode != 'docs-only'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @dallay/rook-dashboard run build

      - uses: bazel-contrib/setup-bazel@e1614ab8b64f375e8e1d6885bc7d47f72e8bd0b1 # 0.19.2
        if: steps.affected.outputs.mode != 'docs-only'
        with:
          bazelisk-cache: true
      - name: Run Bazel test suite
        if: steps.affected.outputs.mode != 'docs-only'
        run: bazel test //... --lockfile_mode=error --test_output=summary
