name: 🏷️ PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 🏷️ Label PR
    uses: dallay/common-actions/.github/workflows/pr-labeler.yml@5efa6a4c8865caf90a607cc5d5232564312048fd # v2.3.0
    with:
      sync-labels: true
      configuration-path: '.github/labeler.yml'
