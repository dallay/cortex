name: 🏷️ PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 🏷️ Label PR
    uses: dallay/common-actions/.github/workflows/pr-labeler.yml@2914eb9522e67957a0b266f10132704d27389e80 # v2.9.0
    with:
      sync-labels: true
      configuration-path: '.github/labeler.yml'
