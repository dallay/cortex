name: 🏷️ PR Labeler

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 🏷️ Label PR
    uses: dallay/common-actions/.github/workflows/pr-labeler.yml@fd7e882c6c0830f25691684a2978074f9e5b6b6a # v2.9.2
    with:
      sync-labels: true
      configuration-path: '.github/labeler.yml'
