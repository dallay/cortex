name: 🏷️ PR Labeler

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 🏷️ Label PR
    uses: dallay/common-actions/.github/workflows/pr-labeler.yml@8dd14d86a6bf1a4673aba902e3c3e27993b0e583 # v2.9.1
    with:
      sync-labels: true
      configuration-path: '.github/labeler.yml'
