name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate release configuration without creating or publishing anything
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.89"

jobs:
  # Huginn is intentionally absent from the active manifest until its external
  # acceptance gates are complete. This job is the only dry-run entry point:
  # it performs local checks and cannot create a PR, release or registry write.
  validate-release-config:
    name: Validate release configuration (read-only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.21"

      - name: Validate product metadata and independence fixtures
        run: |
          node scripts/check-release-config.mjs
          node scripts/release-fixtures.mjs

      - name: Validate YAML and JSON syntax
        run: |
          ruby -ryaml -e 'YAML.load_file(".github/workflows/release.yml")'
          node -e 'for (const file of ["release-please-config.json", ".release-please-manifest.json"]) JSON.parse(require("fs").readFileSync(file))'

  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    outputs:
      rook_release_created: ${{ steps.release.outputs['apps/rook--release_created'] }}
      rook_release_version: ${{ steps.release.outputs['apps/rook--version'] }}
      rook_release_tag: ${{ steps.release.outputs['apps/rook--tag_name'] }}
      rook_release_sha: ${{ steps.release.outputs['apps/rook--sha'] }}
      huginn_release_created: ${{ steps.release.outputs['apps/huginn--release_created'] }}
      huginn_release_version: ${{ steps.release.outputs['apps/huginn--version'] }}
      huginn_release_tag: ${{ steps.release.outputs['apps/huginn--tag_name'] }}
      huginn_release_sha: ${{ steps.release.outputs['apps/huginn--sha'] }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          fork: false

  build-binaries:
    name: Build Rook (${{ matrix.target }})
    needs: release-please
    if: ${{ needs.release-please.outputs.rook_release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # This is deliberately narrower than rust-toolchain.toml. A target is
        # added only after product-specific runtime and clean-machine evidence.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.rook_release_tag }}
          fetch-depth: 0

      - name: Verify immutable release checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.release-please.outputs.rook_release_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@dd44c20b1206a46e25fba8503d5d7c9a33bd355a
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Build Rook
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "${TARGET}" -p rook

      - name: Prepare Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-please.outputs.rook_release_version }}
        run: |
          set -euo pipefail
          cd "target/${TARGET}/release"
          archive="rook-${VERSION}-${TARGET}"
          mkdir "${archive}"
          cp rook "${archive}/"
          cp ../../../README.md "${archive}/" || true
          cp ../../../LICENSE "${archive}/" || true
          tar -czf "${archive}.tar.gz" "${archive}"
          shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
          mv "${archive}.tar.gz" "${archive}.tar.gz.sha256" ../../../

      - name: Prepare Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-please.outputs.rook_release_version }}
        run: |
          Set-StrictMode -Version Latest
          Set-Location "target/$env:TARGET/release"
          $archive = "rook-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force -Path $archive | Out-Null
          Copy-Item rook.exe -Destination "$archive/"
          Copy-Item ../../../README.md -Destination "$archive/" -ErrorAction SilentlyContinue
          Copy-Item ../../../LICENSE -Destination "$archive/" -ErrorAction SilentlyContinue
          Compress-Archive -Path $archive -DestinationPath "$archive.zip"
          (Get-FileHash "$archive.zip" -Algorithm SHA256).Hash.ToLower() + "  $archive.zip" | Out-File "$archive.zip.sha256" -Encoding ascii
          Move-Item -Path "$archive.zip" -Destination ../../..
          Move-Item -Path "$archive.zip.sha256" -Destination ../../..

      - name: Verify binary version
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-please.outputs.rook_release_version }}
        run: |
          set -euo pipefail
          "target/${TARGET}/release/rook" --version | grep -F "${VERSION}"

      - name: Verify Windows binary version
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-please.outputs.rook_release_version }}
        run: .\target\$env:TARGET\release\rook.exe --version | Select-String -SimpleMatch $env:VERSION

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rook-${{ matrix.target }}
          path: |
            rook-*.${{ matrix.archive }}
            rook-*.${{ matrix.archive }}.sha256
          if-no-files-found: error

  upload-assets:
    name: Upload Rook release assets
    needs: [release-please, build-binaries]
    if: ${{ needs.release-please.outputs.rook_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: rook-*
          merge-multiple: true

      - name: Upload assets to the exact Rook release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release-please.outputs.rook_release_tag }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  validate-npm:
    name: Validate Rook npm packages
    needs: [release-please, build-binaries]
    if: ${{ needs.release-please.outputs.rook_release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.rook_release_tag }}
          fetch-depth: 0

      - name: Verify immutable release checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.release-please.outputs.rook_release_sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.21"

      - name: Validate base wrapper and package tarball
        run: |
          node scripts/check-release-config.mjs
          node --check apps/rook/npm/rook/lib/index.js
          npm pack --dry-run ./apps/rook/npm/rook

  publish-npm-platform:
    name: Publish Rook npm platform package (${{ matrix.name }})
    needs: [release-please, build-binaries, validate-npm]
    if: ${{ needs.release-please.outputs.rook_release_created == 'true' && vars.RELEASE_PUBLICATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            target: aarch64-apple-darwin
            package: rook-darwin-arm64
            binary: rook
            archive: tar.gz
          - name: darwin-x64
            target: x86_64-apple-darwin
            package: rook-darwin-x64
            binary: rook
            archive: tar.gz
          - name: linux-x64
            target: x86_64-unknown-linux-gnu
            package: rook-linux-x64
            binary: rook
            archive: tar.gz
          - name: windows-x64
            target: x86_64-pc-windows-msvc
            package: rook-windows-x64
            binary: rook.exe
            archive: zip
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.rook_release_tag }}
          fetch-depth: 0

      - name: Verify immutable release checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.release-please.outputs.rook_release_sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.21"
          registry-url: https://registry.npmjs.org

      - name: Download exact binary artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rook-${{ matrix.target }}
          path: artifacts

      - name: Assemble and publish platform package
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.rook_release_version }}
          PACKAGE_DIR: apps/rook/npm/${{ matrix.package }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${PACKAGE_DIR}/bin"
          if [[ "${ARCHIVE}" == "zip" ]]; then
            unzip -q "artifacts/rook-"*.zip -d artifacts/extracted
          else
            mkdir -p artifacts/extracted
            tar -xzf "artifacts/rook-"*.tar.gz -C artifacts/extracted
          fi
          binary_path="$(find artifacts/extracted -type f -name "${BINARY}" -print -quit)"
          test -n "${binary_path}"
          cp "${binary_path}" "${PACKAGE_DIR}/bin/${BINARY}"
          chmod +x "${PACKAGE_DIR}/bin/${BINARY}"
          node -e 'const fs=require("fs"); const p=process.env.PACKAGE_DIR+"/package.json"; const j=JSON.parse(fs.readFileSync(p)); j.version=process.env.VERSION; fs.writeFileSync(p, JSON.stringify(j,null,2)+"\n")'
          npm pack --dry-run "./${PACKAGE_DIR}"
          npm publish "./${PACKAGE_DIR}" --provenance --access public --ignore-scripts

  publish-npm-base:
    name: Publish Rook npm base package
    needs: [release-please, publish-npm-platform]
    if: ${{ needs.release-please.outputs.rook_release_created == 'true' && vars.RELEASE_PUBLICATION_ENABLED == 'true' && needs.publish-npm-platform.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.rook_release_tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.21"
          registry-url: https://registry.npmjs.org

      - name: Publish base wrapper after platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/check-release-config.mjs
          node --check apps/rook/npm/rook/lib/index.js
          npm publish ./apps/rook/npm/rook --provenance --access public --ignore-scripts

  publish-docker:
    name: Publish Rook container
    needs: [release-please, build-binaries]
    if: ${{ needs.release-please.outputs.rook_release_created == 'true' && vars.RELEASE_PUBLICATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.rook_release_tag }}
          fetch-depth: 0

      - name: Verify immutable release checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.release-please.outputs.rook_release_sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rook-x86_64-unknown-linux-gnu
          path: artifacts

      - name: Prepare Docker context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-context
          tar -xzf artifacts/rook-*.tar.gz -C docker-context --strip-components=1
          mv docker-context/rook docker-context/rook-amd64
          chmod +x docker-context/rook-amd64
          cp apps/rook/Dockerfile docker-context/Dockerfile

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract product-scoped image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rook
            ghcr.io/${{ github.repository_owner }}/rook
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.rook_release_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.rook_release_version }}
            type=raw,value=latest

      - name: Build and push validated Rook image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-context
          file: docker-context/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-summary:
    name: Rook release summary
    needs: [release-please, build-binaries, upload-assets, validate-npm, publish-npm-platform, publish-npm-base, publish-docker]
    if: ${{ always() && needs.release-please.outputs.rook_release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        env:
          VERSION: ${{ needs.release-please.outputs.rook_release_version }}
          TAG: ${{ needs.release-please.outputs.rook_release_tag }}
          SHA: ${{ needs.release-please.outputs.rook_release_sha }}
          BUILD_RESULT: ${{ needs.build-binaries.result }}
          ASSETS_RESULT: ${{ needs.upload-assets.result }}
          NPM_VALIDATION_RESULT: ${{ needs.validate-npm.result }}
          NPM_PLATFORM_RESULT: ${{ needs.publish-npm-platform.result }}
          NPM_BASE_RESULT: ${{ needs.publish-npm-base.result }}
          DOCKER_RESULT: ${{ needs.publish-docker.result }}
        run: |
          {
            echo "# Rook release summary"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Tag: \`${TAG}\`"
            echo "- SHA: \`${SHA}\`"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Build | ${BUILD_RESULT} |"
            echo "| GitHub assets | ${ASSETS_RESULT} |"
            echo "| npm validation | ${NPM_VALIDATION_RESULT} |"
            echo "| npm platform publication | ${NPM_PLATFORM_RESULT} |"
            echo "| npm base publication | ${NPM_BASE_RESULT} |"
            echo "| Docker publication | ${DOCKER_RESULT} |"
            echo ""
            echo "Huginn is not part of this release and has no active publication job."
          } >> "$GITHUB_STEP_SUMMARY"
