name: Technical task
description: Maintenance, refactor, tooling, or operational work
labels: [ "type/chore" ]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which product owns this? Use Shared for cross-cutting work. Exactly one.
      options:
        - Rook
        - Huginn
        - Shared
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Technical Area
      description: Primary technical area.
      options:
        - auth
        - ci
        - core
        - dashboard
        - dependencies
        - docs
        - observability
        - providers
        - release
        - runtime
        - storage
        - testing
        - transport
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is the objective of this technical task?
      placeholder: "Describe the goal and why this work is needed."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any background information or related issues.
      placeholder: "Provide context, links to related issues, or references."
    validations:
      required: false
  - type: textarea
    id: exit-criteria
    attributes:
      label: Exit Criteria
      description: What must be true when this task is complete?
      placeholder: |
        - [ ] Tests pass
        - [ ] Documentation updated
        - [ ] CI passes
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Notes (optional)
      description: Any other notes, constraints, or considerations.
      placeholder: "Add any additional information here."
    validations:
      required: false
