name: Bug report
description: Report incorrect behavior
labels: [ "type/bug" ]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which product is affected? Exactly one.
      options:
        - Rook
        - Huginn
        - Shared
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Technical Area
      description: Primary technical area.
      options:
        - auth
        - ci
        - core
        - dashboard
        - dependencies
        - docs
        - observability
        - providers
        - release
        - runtime
        - storage
        - testing
        - transport
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version are you running?
      placeholder: "e.g., 0.1.0, main branch commit hash"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your operating system, Rust version, browser (if dashboard), etc.
      placeholder: |
        - OS: macOS 14
        - Rust: 1.75.0
        - Browser: Chrome 120
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How impactful is this bug?
      options:
        - "Critical — System is unusable; data loss or security risk"
        - "High — Major functionality broken; no workaround"
        - "Medium — Functionality impaired; workaround exists"
        - "Low — Minor issue; cosmetic or edge case"
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "Describe the expected behavior."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "Describe what actually happened, including error messages."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe the error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots (optional)
      description: Relevant logs, stack traces, or screenshots.
      placeholder: "Paste logs or drag and drop screenshots here."
    validations:
      required: false
