# =============================================================================
# Nuxa/Rook — lefthook configuration
# =============================================================================
# Universal install (any OS):
#   npx lefthook@latest install
#
# Or via npm (if Node.js available):
#   npm install -g lefthook && npx lefthook install
#
# Or via curl (standalone):
#   curl -fsSL https://raw.githubusercontent.com/evilmartians/lefthook/master/bin/lefthook_darwin_amd64 -o /usr/local/bin/lefthook && chmod +x /usr/local/bin/lefthook
# =============================================================================

# =============================================================================
# Hooks
# =============================================================================

pre-commit:
  parallel: true
  commands:
    fmt:
      run: rustup run stable cargo fmt --all
      stage_fixed: true

    check:
      run: cargo check --workspace

    markdown:
      run: pnpm exec markdownlint-cli2 "*.md" "docs/**/*.md"
      glob: "*.md"

    dashboard-biome:
      root: "apps/rook/dashboard/"
      glob: "*.{js,ts,vue,json,css}"
      run: pnpm exec biome check --write --diagnostic-level=error --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    # GitGuardian (ggshield): scan commits about to be pushed for secrets.
    # The wrapper separates "the scan completed and found something" from "the
    # scanner could not run" (unauthenticated ggshield, server unavailable, and
    # so on), so a blocked push names the real cause. `fail_text` stays unset on
    # purpose: lefthook prints it on every non-zero exit, which is exactly the
    # false "found secrets" report for scanner failures.
    # Set CORTEX_SECRET_SCAN_REQUIRED=1 to fail closed when ggshield is missing.
    # https://docs.gitguardian.com/ggshield-docs/integrations/git-hooks/pre-push
    ggshield:
      run: bash scripts/pre-push-secret-scan.sh "$@"

    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings

    test:
      run: cargo test --workspace

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

# ---------- POST-CHECKOUT / POST-MERGE / POST-REWRITE ----------
# AgentSync: sync agent config (skills, commands) after any
# checkout, merge, or rewrite — keeps local tooling in sync
# without inventing a second hook system.
post-checkout:
  commands:
    agentsync-apply:
      run: pnpm dlx @dallay/agentsync@latest apply || true

post-merge:
  commands:
    agentsync-apply:
      run: pnpm dlx @dallay/agentsync@latest apply || true

post-rewrite:
  commands:
    agentsync-apply:
      run: pnpm dlx @dallay/agentsync@latest apply || true
