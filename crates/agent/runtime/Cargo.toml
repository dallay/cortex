[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
agent-core = { path = "../core" }
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { workspace = true, features = ["stream"] }
bytes = "1"
libc = "0.2"
rusqlite.workspace = true
uuid.workspace = true
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process"] }
similar = "3"
fs2 = "0.4"
process-wrap = { version = "10", features = ["tokio1", "process-group", "kill-on-drop"] }

[dev-dependencies]
tempfile = "3"
axum.workspace = true

[lints]
workspace = true
