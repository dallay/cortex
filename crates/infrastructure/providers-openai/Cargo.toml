[package]
name = "providers-openai"
version = "0.0.1"
edition = "2021"

[dependencies]
shared-kernel = { path = "../../domain/shared-kernel" }
rook-core = { path = "../../domain/rook-core" }
providers-core = { path = "../providers-core" }
sse-stream = { path = "../sse-stream" }

# Async
async-trait = "0.1"
tokio = { version = "1", features = ["rt"] }
futures = "0.3"

# HTTP
reqwest = { version = "0.13", features = ["form", "json", "rustls", "stream"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
# Codex OAuth and private state storage
fs2 = "0.4"
tokio = { version = "1", features = ["sync", "time"] }
base64.workspace = true
sha2 = "0.11"
rand.workspace = true
subtle = "2"

[dev-dependencies]
tempfile = "=3.27.0"
wiremock = "=0.6.5"

[lints]
workspace = true
