[package]
name = "providers-core"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
# Serialization — needed for JSON validation and sanitization in provider adapters
serde = { workspace = true }
serde_json = { workspace = true }

# Domain types — needed for Role conversion helpers
rook-core = { path = "../../domain/rook-core" }

anyhow = "1"
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["net"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt"] }
reqwest = { version = "=0.13.5", default-features = false }
rook-core = { path = "../../domain/rook-core" }

[lints]
workspace = true