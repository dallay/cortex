[package]
name = "observability"
version = "0.0.1"
edition = "2021"

[dependencies]
shared-kernel = { path = "../../domain/shared-kernel" }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"

# Async
tokio = { workspace = true, features = ["rt", "macros"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Concurrent storage
dashmap = "6.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }

[lints]
workspace = true
