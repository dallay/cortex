[package]
name = "huginn-presentation"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
publish = false

[features]
test-driver = ["dep:huginn-application"]

[[bin]]
name = "tui-fixture"
path = "tests/support/fixture.rs"
required-features = ["test-driver"]

[dependencies]
cap-std = "4.0.3"
# Used by the explicit PTY fixture host only.
huginn-application = { path = "../application", optional = true }
huginn-core = { path = "../core" }
huginn-plugin-api = { path = "../plugin-api" }
huginn-reference-extension = { path = "../reference-extension" }
async-trait.workspace = true
futures.workspace = true
tokio.workspace = true
uuid.workspace = true
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
unicode-width = "0.2"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
# Safe, nonblocking host input after Ratatui's initial cursor query.
rustix = { version = "1", features = ["event"] }

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"

[lints]
workspace = true
