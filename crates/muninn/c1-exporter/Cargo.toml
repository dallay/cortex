[package]
name = "muninn-c1-exporter"
version.workspace = true
edition.workspace = true
license = "MIT"
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
cpu-f32 = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:safetensors", "dep:tokenizers"]

[[bin]]
name = "export_minilm_c1"
path = "src/main.rs"
required-features = ["cpu-f32"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
uuid = { workspace = true }
candle-core = { version = "=0.11.0", default-features = false, optional = true }
candle-nn = { version = "=0.11.0", default-features = false, optional = true }
candle-transformers = { version = "=0.11.0", default-features = false, optional = true }
safetensors = { version = "=0.8.0", optional = true }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
calcifer-macos-acl = "=0.1.0"

[dev-dependencies]
tempfile = "=3.27.0"
