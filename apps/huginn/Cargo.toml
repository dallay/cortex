[package]
name = "huginn"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
publish = false

[features]
default = ["reference-extension"]
reference-extension = ["dep:huginn-reference-extension"]

[[bin]]
name = "huginn"
path = "src/main.rs"

[dependencies]
huginn-application = { path = "../../crates/huginn/application" }
huginn-core = { path = "../../crates/huginn/core" }
huginn-runtime = { path = "../../crates/huginn/runtime" }
huginn-presentation = { path = "../../crates/huginn/presentation" }
huginn-reference-extension = { path = "../../crates/huginn/reference-extension", optional = true }
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
futures.workspace = true
huginn-plugin-api = { path = "../../crates/huginn/plugin-api" }
portable-pty = "0.9"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "process", "time"] }

[lints]
workspace = true
