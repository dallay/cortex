# sonar-project.properties: dallay/cortex (Rust + Vue/TS monorepo, single SonarCloud project)
# Reference: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/analysis-parameters
#
# NOTE: this file uses flat `key=value` lines. The `+=` syntax does NOT exist
# in .properties (`sonar.sources+=...` would create a dead key literally named
# `sonar.sources+` and that entry would be silently lost).
sonar.projectKey=dallay_cortex
sonar.organization=dallay
sonar.projectName=cortex
sonar.sourceEncoding=UTF-8
# A single project for the whole monorepo: `apps` covers apps/rook (Rust),
# apps/huginn (Rust) and apps/rook/dashboard/src (Vue/TS); `crates` covers all the
# members of the Rust workspace. New crates are picked up automatically, without
# enumerating them one by one (the previous manual list was already outdated: it was
# missing providers-core, provider-utils, combo-sqlite, alias-sqlite,
# apps/huginn, crates/huginn/* and others).
sonar.sources=apps,crates
# Coverage (generated in CI *before* the scan step, see the `sonar` job in
# .github/workflows/ci.yml):
# - JS/TS via Vitest (LCOV). Docs:
#   https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/javascript-typescript-test-coverage
# - Rust via cargo-llvm-cov (LCOV). Docs:
#   https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/test-coverage-parameters
# A missing report only leaves a warning in the scanner log, it does not fail the analysis.
sonar.javascript.lcov.reportPaths=apps/rook/dashboard/coverage/lcov.info
sonar.rust.lcov.reportPaths=coverage/rust-lcov.info
# Never analyze build artifacts, vendored bundles, generated files or CI config.
# ui/* is a vendored shadcn/Reka style kit (headless): ARIA roles and slot
# composition generate false positives in S6819/S6822/ItemTagCheck and
# S5256 (th per slot). It is excluded to avoid breaking the headless UI; the real
# accessibility is verified in the own views (SettingsView, ApiKeyForm, ApiKeysView).
sonar.exclusions=**/target/**,**/dist/**,**/node_modules/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/*.lock,**/Cargo.lock,**/pnpm-lock.yaml,**/apps/rook/npm/rook/**,**/apps/rook/dashboard/e2e/**,**/apps/rook/dashboard/src/components/ui/**,**/dev/**,.github/**
# Test/spec files are real code: they are analyzed, but they do not count as
# uncovered production code.
sonar.coverage.exclusions=**/tests/**,**/test_*.rs,**/*_test.rs,**/*.spec.ts,**/*.test.ts,**/e2e/**,**/*.config.ts,**/apps/rook/dashboard/src/components/ui/**,**/crates/domain/rook-core/src/provider_descriptor.rs
# Tests and the UI kit have intentional duplication (fakes, fixtures, variants per
# slot). Excluding them from CPD lowers the noise without hiding production
# duplication (api_key_rate_limiter, config.rs are still analyzed).
sonar.cpd.exclusions=**/tests/**,**/test_*.rs,**/*_test.rs,**/*.spec.ts,**/*.test.ts,**/e2e/**,**/apps/rook/dashboard/src/components/ui/**
