# sonar-project.properties — dallay/cortex (monorepo Rust + Vue/TS, single SonarCloud project)
# Reference: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/analysis-parameters
#
# NOTE: this file uses flat `key=value` lines. `+=` syntax does NOT exist
# in .properties (`sonar.sources+=...` would create a dead key literally named
# `sonar.sources+` and that entry would be lost silently).

sonar.projectKey=dallay_cortex
sonar.organization=dallay
sonar.projectName=cortex
sonar.sourceEncoding=UTF-8

# Single project for the entire monorepo: `apps` covers apps/rook (Rust),
# apps/huginn (Rust), and apps/rook/dashboard/src (Vue/TS); `crates` covers all
# Rust workspace members. New crates are picked up automatically, without having to
# enumerate them one by one (the previous manual list was already obsolete).
sonar.sources=apps,crates

# Coverage (generated in CI *before* the scan step — see `sonar` job in
# .github/workflows/ci.yml):
# - JS/TS via Vitest (LCOV). Doc:
#   https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/javascript-typescript-test-coverage
# - Rust via cargo-llvm-cov (LCOV). Doc:
#   https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/test-coverage-parameters
# A missing report leaves only a warning in the scanner log, it does not fail analysis.
sonar.javascript.lcov.reportPaths=apps/rook/dashboard/coverage/lcov.info
sonar.rust.lcov.reportPaths=coverage/rust-lcov.info

# Never analyze build artifacts, vendored bundles, generated files, or CI config.
# ui/* is a vendored shadcn/Reka style kit (headless): ARIA roles and slot
# composition trigger false positives on S6819/S6822/ItemTagCheck and
# S5256 (th by slot). Excluded to avoid breaking headless UI; real accessibility
# is verified in application views (SettingsView, ApiKeyForm, ApiKeysView).
sonar.exclusions=**/target/**,**/dist/**,**/node_modules/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/*.lock,**/Cargo.lock,**/pnpm-lock.yaml,**/apps/rook/npm/rook/**,**/apps/rook/dashboard/e2e/**,**/apps/rook/dashboard/src/components/ui/**,**/dev/**,.github/**

# Test/spec files are real code: they are analyzed, but do not count as
# uncovered productive code.
sonar.coverage.exclusions=**/tests/**,**/test_*.rs,**/*_test.rs,**/*.spec.ts,**/*.test.ts,**/e2e/**,**/*.config.ts,**/apps/rook/dashboard/src/components/ui/**

# Tests and UI kit have intentional duplication (fakes, fixtures, slot variants).
# Excluding them from CPD reduces noise without hiding productive duplication
# (api_key_rate_limiter, config.rs remain analyzed).
sonar.cpd.exclusions=**/tests/**,**/test_*.rs,**/*_test.rs,**/*.spec.ts,**/*.test.ts,**/e2e/**,**/apps/rook/dashboard/src/components/ui/**
