# sonar-project.properties — dallay/cortex (monorepo Rust + Vue/TS, un solo proyecto SonarCloud)
# Referencia: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/analysis-parameters
#
# NOTA: este fichero usa lineas planas `clave=valor`. La sintaxis `+=` NO existe
# en .properties (`sonar.sources+=...` crearia una clave muerta llamada
# literalmente `sonar.sources+` y esa entrada se perderia en silencio).

sonar.projectKey=dallay_cortex
sonar.organization=dallay
sonar.projectName=cortex
sonar.sourceEncoding=UTF-8

# Un solo proyecto para todo el monorepo: `apps` cubre apps/rook (Rust),
# apps/agent (Rust) y apps/rook/dashboard/src (Vue/TS); `crates` cubre todos los
# miembros del workspace Rust. Los crates nuevos se recogen solos, sin tener que
# enumerarlos uno por uno (la lista manual anterior ya estaba obsoleta: le
# faltaban providers-core, provider-utils, combo-sqlite, alias-sqlite,
# apps/agent, crates/agent/*, ...).
sonar.sources=apps,crates

# Coverage (se genera en CI *antes* del paso de scan — ver job `sonar` en
# .github/workflows/ci.yml):
# - JS/TS via Vitest (LCOV). Doc:
#   https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/javascript-typescript-test-coverage
# - Rust via cargo-llvm-cov (LCOV). Doc:
#   https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/test-coverage-parameters
# Un reporte ausente solo deja un warning en el log del scanner, no tumba el analisis.
sonar.javascript.lcov.reportPaths=apps/rook/dashboard/coverage/lcov.info
sonar.rust.lcov.reportPaths=coverage/rust-lcov.info

# Nunca analizar artefactos de build, bundles vendoreados, ficheros generados ni config de CI.
sonar.exclusions=**/target/**,**/dist/**,**/node_modules/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/*.lock,**/Cargo.lock,**/pnpm-lock.yaml,**/apps/rook/npm/rook/**,**/apps/rook/dashboard/e2e/**,**/dev/**,.github/**

# Los ficheros de test/spec son codigo real: se analizan, pero no cuentan como
# codigo productivo sin cubrir.
sonar.coverage.exclusions=**/tests/**,**/test_*.rs,**/*_test.rs,**/*.spec.ts,**/*.test.ts,**/e2e/**,**/*.config.ts
