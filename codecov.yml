# Codecov Configuration for code-quality (Rook)
# Backend (Rust) + Frontend (Vue.js Dashboard)

codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false

      # Backend (Rust) coverage target
      backend:
        target: 85%
        threshold: 2%
        flags:
          - backend
        informational: false

      # Frontend (Dashboard) coverage target
      frontend:
        target: 80%
        threshold: 2%
        flags:
          - frontend
        informational: false

    patch:
      default:
        target: 80%
        threshold: 5%
        informational: false

      backend:
        target: 85%
        threshold: 5%
        flags:
          - backend

      frontend:
        target: 75%
        threshold: 5%
        flags:
          - frontend

# Flag Management - Automatic approach
flag_management:
  default_rules:
    carryforward: true

  individual_flags:
    - name: backend
      paths:
        - "apps/rook/src/**"
        - "apps/rook/tests/**"
        - "crates/**"
      carryforward: true

    - name: frontend
      paths:
        - "apps/rook/dashboard/**"
      carryforward: true

# Component Management - Coverage breakdown by product
# Components are virtual filters defined only in this file: no extra uploads
# and no changes to the CI jobs. The Rust upload already covers the whole
# workspace, so each component slices it by path.
component_management:
  default_rules:
    # Informational by default: components measure, they do not block merges.
    # Codecov statuses are not in the branch ruleset, so a failing component
    # status cannot block a pull request.
    statuses:
      - type: project
        target: auto
        informational: true
      - type: patch
        target: 80%
        informational: true

  individual_components:
    # Rook: the API proxy and router.
    - component_id: rook
      name: rook
      paths:
        - "apps/rook/src/**"
        - "apps/rook/tests/**"
        - "crates/domain/**"
        - "crates/application/**"
        - "crates/infrastructure/**"
        - "crates/test-support/**"

    # Huginn: the local programming agent. These paths fall outside the
    # `backend` flag, so the component is the only view that reports them.
    - component_id: huginn
      name: huginn
      paths:
        - "apps/huginn/src/**"
        - "apps/huginn/tests/**"
        - "crates/huginn/**"

    # Dashboard: the Vue.js front end.
    - component_id: dashboard
      name: dashboard
      paths:
        - "apps/rook/dashboard/**"

# Comment configuration
comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false
  require_base: yes
  require_head: yes
  branches: null
  show_carryforward_flags: true
  # Path filters can skip one coverage job; carryforward supplies that flag.
  # Post after the first report and let Codecov update the comment when needed.
  after_n_builds: 1

# Ignore patterns
ignore:
  - "apps/rook/dashboard/node_modules"
  - "apps/rook/dashboard/dist"
  - "target/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/__tests__/**"
  # Declarative provider data: const fn constructors are evaluated at
  # compile time, so coverage instrumentation reports their bodies as
  # never executed even though the table is exercised by
  # rook-core/tests/descriptor_table.rs.
  - "crates/domain/rook-core/src/provider_descriptor.rs"

# Bundle Analysis Configuration (for frontend)
bundle_analysis:
  warning_threshold: "5%"
  status: "informational"

# GitHub-specific configuration
github_checks:
  annotations: true
